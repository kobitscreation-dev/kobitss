<!doctype html>
<html lang="en" data-theme="noir" data-accent="mono" data-density="default" data-width="standard" data-bg="grid">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kobits — Engineering Dashboard</title>
  <meta name="description" content="Kobits autonomous multi-agent software engineering dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css?v=6" />
  <!-- Handwritten "K" Monochrome Favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='8' fill='%23050505'/%3E%3Cpath d='M11.5 6.5C11.1 13.5 10.2 21.5 9.6 29.2M26.2 7.2C20.8 11.4 15.2 16.0 10.6 19.6M13.2 17.4C17.0 21.2 21.6 25.8 27.2 29.0' stroke='%23ffffff' stroke-width='3.8' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
  <script>
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const sessionToken = params.get('session_token');
        if (sessionToken) {
          localStorage.setItem('kobits_token', sessionToken);
          params.delete('session_token');
          const cleanQuery = params.toString();
          const cleanUrl = window.location.pathname + (cleanQuery ? '?' + cleanQuery : '') + (window.location.hash || '#overview');
          window.history.replaceState({}, document.title, cleanUrl);
        }
        const root = document.documentElement;
        const theme = localStorage.getItem('kobits.theme');
        const density = localStorage.getItem('kobits.density');
        const width = localStorage.getItem('kobits.width');
        const bg = localStorage.getItem('kobits.bg');
        if (theme) root.setAttribute('data-theme', theme);
        if (density) root.setAttribute('data-density', density);
        if (width) root.setAttribute('data-width', width);
        if (bg) root.setAttribute('data-bg', bg);
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div class="ky-shell">
    <!-- Top Kyros-style Navigation Bar -->
    <header class="ky-topbar">
      <div class="ky-topbar-inner">
        <div style="display:flex;align-items:center;gap:12px">
          <a class="ky-brand" href="#overview" aria-label="Kobits Home">
            <span class="ky-logo-badge" aria-hidden="true">
              <!-- Expressive Handwritten Calligraphic Brush-Stroke 'K' (Kyros Style) -->
              <svg class="ky-logo-svg" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12.2 5.8C11.4 13.2 10.1 21.8 9.2 31.4" stroke="currentColor" stroke-width="3.8" stroke-linecap="round"/>
                <path d="M28.4 6.8C22.4 11.4 16.2 16.4 10.8 20.2" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
                <path d="M13.8 17.8C17.8 21.9 22.6 27.1 29.2 30.8" stroke="currentColor" stroke-width="3.7" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="ky-brand-word">KOBITS</span>
          </a>
          <span style="color:var(--border-strong);font-size:16px;user-select:none;font-weight:300">/</span>
          <div class="ky-project-pill" title="Active Workspace Project">
            <span class="ky-dot-live"></span>
            <select id="ky-project-select" aria-label="Select Project">
              <option value="">Loading project…</option>
            </select>
          </div>
        </div>

        <div class="ky-topbar-right">
          <button id="ky-topbar-new-project" type="button" class="ky-btn ky-btn-ghost ky-btn-xs" style="display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border)" title="Start a New Engineering Project">
            <span>+</span>
            <span>New Project</span>
          </button>
          <button id="ky-topbar-tour" type="button" class="ky-btn ky-btn-ghost ky-btn-xs" style="display:inline-flex;align-items:center;gap:4px" title="Product Walkthrough Tutorial">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            <span>Tour</span>
          </button>
          <button id="ky-topbar-new" type="button" class="ky-btn ky-btn-primary ky-btn-xs" style="display:inline-flex;align-items:center;gap:4px">
            <span>+</span>
            <span>New Mission</span>
          </button>
          <a href="#settings" id="ky-topbar-github" class="ky-btn ky-btn-ghost ky-btn-xs" style="display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);text-decoration:none" title="GitHub Account Integration">
            <svg width="13" height="13" fill="currentColor" viewBox="0 0 24 24">
              <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"/>
            </svg>
            <span id="ky-topbar-gh-label">GitHub</span>
          </a>
          <button id="ky-topbar-settings" type="button" class="ky-btn ky-btn-ghost ky-btn-xs" style="display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border)" title="Workspace & Account Settings">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Settings</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Kyros Container -->
    <main class="ky-main" id="view" tabindex="-1"></main>
  </div>

  <!-- Modal Host (Deliverable, Sandbox Diff Inspector & Workspace Settings) -->
  <div id="ky-modal-host"></div>

  <!-- Toast Notifications -->
  <div class="ky-toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/app.js?v=12"></script>
</body>
</html>
