services:
  - type: web
    name: kobits
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./kobits.db
      - key: KOBITS_SANDBOX_DRIVER
        value: jail
      - key: OAUTH_REDIRECT_BASE
        value: https://kobits.space
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        sync: false
      - key: AWS_BEDROCK_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
