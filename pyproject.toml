[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kobits"
version = "2.0.0"
description = "Kobits Terminal Engine - Autonomous Multi-Agent Software Engineering CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "httpx>=0.27.0",
    "networkx>=3.0",
]

[project.scripts]
kobits = "kobits_cli:main"

[tool.setuptools]
py-modules = ["kobits_cli"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["backend/tests", "tests"]
